name: Raccolta quote tennis

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raccolta-tennis
  cancel-in-progress: false

jobs:
  raccolta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raccogli quote
        run: python raccolta_tennis.py

      - name: Salva i dati
        run: |
          git config user.name "raccolta-bot"
          git config user.email "raccolta-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "quote $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
